server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets, so those files are immutable:
    # a change to one produces a new name. Cache them hard. Cache-Control is set
    # by hand rather than by `expires`, which would emit a second, conflicting one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # The brand mark, favicon and fonts are not fingerprinted, so they get a short
    # cache that a redeploy can still displace within the day.
    location ~* \.(svg|woff2?|png|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the current asset bundle, so it must never be held by
        # a cache — a stale copy points at files that no longer exist.
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api {
        proxy_pass http://lens_backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 20M;
        # /api/chat streams Server-Sent Events for the length of an agent run.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml font/woff2;
}
