# Included by nginx.conf. It lives in snippets/ rather than conf.d/, because
# nginx auto-includes conf.d/*.conf into the http context — this file is meant
# to be pulled into individual locations, not loaded on its own.
# nginx only inherits `add_header` from an outer block when the inner block sets
# none of its own. Every location here sets Cache-Control, which would silently
# drop these — so each one includes this file explicitly instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
